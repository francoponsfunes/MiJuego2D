<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The last cigarette</title>

    <style>

        body {

            margin: 0;

            background: #111;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            overflow: hidden;
        }

        canvas {

            display: block;

            background: #222;
        }

    </style>

</head>

<body>

    <canvas
        id="gameCanvas"
        width="800"
        height="600"
    ></canvas>


    <!-- ================================================================ -->
    <!-- CARGA DEL JUEGO SIN UTILIZAR VERSIONES ANTIGUAS EN CACHÉ -->
    <!-- ================================================================ -->

    <script>

        const gameVersion = Date.now();

                const gameScripts = [

            "core.js",

            "upgrades.js",

            "projectiles.js",

            "player.js",

            "items.js",

            "enemies.js",

            "bosses.js",

            "rooms.js",

            "collisions.js",

            "ui.js",

            "game.js"
        ];


        function loadGameScript(scriptIndex = 0) {

            if (
                scriptIndex >=
                gameScripts.length
            ) {

                return;
            }


            const script =
                document.createElement("script");


            script.src =
                gameScripts[scriptIndex] +
                "?v=" +
                gameVersion;


            script.onload = () => {

                loadGameScript(
                    scriptIndex + 1
                );
            };


            script.onerror = () => {

                console.error(

                    "No se pudo cargar el archivo del juego:",

                    gameScripts[scriptIndex]
                );
            };


            document.body.appendChild(
                script
            );
        }


        loadGameScript();

    </script>

</body>

</html>
